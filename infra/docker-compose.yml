name: meminios

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: meminios
      POSTGRES_USER: meminios
      POSTGRES_PASSWORD: meminios
    ports:
      - "55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U meminios -d meminios"]
      interval: 3s
      timeout: 3s
      retries: 20
    volumes:
      - meminios-postgres:/var/lib/postgresql/data

volumes:
  meminios-postgres:
